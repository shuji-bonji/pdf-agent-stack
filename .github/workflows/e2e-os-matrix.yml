name: E2E OS matrix (trial 2026-11 E5)

# eval/e2e を 3 OS × CPU の行列で回す（試用 #47 の E5）。起動するのは stack.json の公開版。
# 確かめること: 4 サーバーの起動と tools/list（S0）、空白・日本語・`C:/` 形式のパス（S0-paths）、S1〜S5。
# 期待値は e2e.yml と同じく緩めない。落ちたジョブは落ちたまま残す（fail-fast: false）。
#
# F-13（Windows で setup.mjs が spawnSync npm.cmd EINVAL で止まる）は、run 41661871087・41667260819 で
# 再現したのを確かめてから、setup.mjs を npm_execpath を node で実行する形に直した。
#
# 実行マシンに空きが無いと、ジョブは割り当てを待ち続ける（run 41661871087 では macos-latest（arm64）が
# 割り当てられないまま終わった）。そのときは取り消して、後で再実行する。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # x64
          - ubuntu-24.04-arm # arm64
          - macos-latest # arm64
          - macos-15-intel # x64
          - windows-latest # x64
          - windows-11-arm # arm64
    defaults:
      run:
        working-directory: eval/e2e
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund

      - run: npm run setup

      - name: Summary（環境と起動した版）
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo ""
            echo "| 項目 | 値 |"
            echo "| --- | --- |"
            echo "| OS・CPU | $(node -p 'process.platform + "-" + process.arch') |"
            echo "| Node.js | $(node --version) |"
            echo "| npm | $(npm --version) |"
            echo "| 起動した版 | $(node setup.mjs --print) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: test
        run: >
          node --test --test-concurrency=1 --test-timeout=180000
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=junit.xml
          tests/*.test.mjs

      - name: 結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: eval/e2e/junit.xml
          if-no-files-found: warn
